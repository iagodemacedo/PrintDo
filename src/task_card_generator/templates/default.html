<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: -apple-system, 'Helvetica Neue', Helvetica, sans-serif;
        background: white;
        width: 576px;
        color: #111;
    }
    .card {
        padding: 20px 16px;
    }
    .title {
        font-size: 34px;
        font-weight: 700;
        text-align: center;
        line-height: 1.2;
        margin-bottom: 14px;
        word-wrap: break-word;
    }
    .sep {
        border: none;
        border-top: 2px dashed #bbb;
        margin: 10px 0;
    }
    .meta {
        font-size: 17px;
        color: #333;
        margin: 5px 0;
    }
    .meta-label {
        font-weight: 600;
    }
    .tags {
        margin: 8px 0;
    }
    .tag {
        display: inline-block;
        border: 1.5px solid #888;
        border-radius: 4px;
        padding: 2px 10px;
        margin: 2px 3px;
        font-size: 15px;
        color: #555;
    }
    .notes {
        font-size: 15px;
        color: #444;
        margin-top: 8px;
        white-space: pre-wrap;
        line-height: 1.4;
    }
    .due-date {
        font-size: 22px;
        font-weight: 600;
        text-align: center;
        margin-top: 10px;
    }
    .checklist-item {
        font-size: 16px;
        margin: 3px 0;
        color: #333;
    }
    .checklist-item::before {
        content: "\2610  ";
    }
</style>
</head>
<body>
<div class="card">
    <div class="title">{{ task.name }}</div>

    <hr class="sep">

    {% if task.project %}
    <div class="meta"><span class="meta-label">Project:</span> {{ task.project }}</div>
    {% endif %}

    {% if task.due_date %}
    <div class="due-date">{{ task.due_date }}</div>
    {% endif %}

    {% if task.tags %}
    <div class="tags">
        {% for tag in task.tags %}
        <span class="tag">{{ tag }}</span>
        {% endfor %}
    </div>
    {% endif %}

    {% if task.notes %}
    <hr class="sep">
    <div class="notes">{{ task.notes }}</div>
    {% endif %}
</div>
</body>
</html>
